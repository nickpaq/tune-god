  <circle cx="40" cy="52" r="1" fill="#fff"/>
  <circle cx="62" cy="52" r="1" fill="#fff"/>
  <path d="M50 54 L47.500 63 Q50 65 52.500 63" fill="none" stroke="#c99a82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the teardrop tattoo, just under his left eye -->
