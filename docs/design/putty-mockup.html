<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=402,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* iPhone 17 Pro: 402 x 874 pt, rendered at 3x = 1206 x 2622 px. Putty skin. */
:root{
  --ch1:#d3cdbb;--ch2:#bcb5a1;--hi:#efeadb;--edge:#8b8573;--ink2:#38342b;--ink3:#625d4f;
  --lcd:#93a98a;--bezel:#8a8473;--lcd-edge:#5d6e56;--lcd-glow:#4e6147;--lcd-ink:#1f2a1c;--lcd-ink2:#3b4a37;
  --well:#a39d8b;--btn:#e4dfcd;--btnedge:#8b8573;--btnring:#a49e8c;--accent:#e8412a;--accent-ink:#fff;
  --f-label:"Archivo Narrow",Arial,sans-serif;--f-lcd:"VT323",monospace;
}
*{box-sizing:border-box;margin:0}
html,body{background:transparent;width:402px;height:874px;overflow:hidden}
.screen{position:relative;width:402px;height:874px;border-radius:62px;overflow:hidden;
  background:linear-gradient(var(--ch1),var(--ch2));font-family:var(--f-label);font-weight:700;color:var(--ink2);
  box-shadow:inset 0 2px 0 var(--hi)}
.island{position:absolute;top:11px;left:50%;width:126px;height:37px;margin-left:-63px;border-radius:19px;background:#000;z-index:5}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#2b2820;opacity:.7}

/* top bar */
.bar{position:absolute;top:60px;left:12px;right:12px;height:38px;display:flex;align-items:center;gap:5px;z-index:4}
.btn{height:32px;min-width:32px;padding:0 9px;border-radius:7px;background:var(--btn);box-shadow:0 2px 0 var(--btnedge);
  display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);flex:none}
.btn.prim{background:var(--accent);color:var(--accent-ink)}
.btn.round{width:32px;min-width:32px;padding:0;border-radius:50%}
.btn.kb{padding:0 8px;gap:3px;width:50px}
.kb svg{display:block}
.arrow{transition:transform .28s ease;transform-origin:center}
.open .arrow{transform:scaleX(-1)}
.banks{display:flex;gap:3px;background:var(--well);padding:3px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--edge);flex:none}
.banks span{width:22px;height:26px;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--btn);color:var(--ink3);box-shadow:0 2px 0 var(--btnedge);border-radius:5px}
.banks span.cur{background:var(--accent);color:#fff}
.sp{flex:1}

/* drawer: key selector */
.drawer{position:absolute;top:104px;left:12px;right:12px;height:0;overflow:hidden;border-radius:10px;background:var(--well);
  z-index:6;transition:height .32s cubic-bezier(.3,.9,.3,1)}
.open .drawer{height:78px;box-shadow:0 0 0 1px var(--edge),0 12px 24px #0004}
.drawer .inner{padding:8px 8px 0;height:78px}
.drawer .cap{font-size:10px;letter-spacing:.14em;color:var(--ink3);margin:0 2px 5px}
.ks{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.ks i{height:46px;border-radius:4px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-style:normal;font-size:11px;
  background:#efebdd;color:var(--ink2);box-shadow:0 2px 0 #aaa58f}
.ks i.blk{background:#7d7867;color:#eee9d8;box-shadow:0 2px 0 #4b473c}
.ks i.sel{box-shadow:0 2px 0 var(--accent),inset 0 -4px 0 var(--accent)}

/* display */
.lcd{position:absolute;top:112px;left:12px;right:12px;height:241px;background:var(--lcd);border:7px solid var(--bezel);border-radius:8px;
  box-shadow:inset 0 0 0 1px var(--lcd-edge),inset 0 0 22px var(--lcd-glow);display:flex;flex-direction:column;justify-content:center;padding:0 20px}
.lcd h3{font:400 46px/.95 var(--f-lcd);color:var(--lcd-ink);letter-spacing:.02em}
.lcd small{font:400 28px/1 var(--f-lcd);color:var(--lcd-ink2);margin-top:8px}

/* pads: last row's labels end at y=812, where the screen corner curve begins */
.pads{position:absolute;left:10px;right:10px;top:369px;display:grid;grid-template-columns:repeat(4,88px);column-gap:10px;row-gap:24px}
.pad{--wt:#38383c;--wb:#4a4a50;position:relative;height:88px;border-radius:9px;background:#7b7b7e;transition:transform .06s}
.pad.on{--wt:color-mix(in srgb,var(--c) 70%,#555);--wb:color-mix(in srgb,var(--c) 62%,#e6e6ee)}
.pad span{position:absolute;left:2px;top:calc(100% + 9px);font-size:10px;line-height:1;letter-spacing:.04em;color:var(--ink3)}
.pad.down{transform:translateY(1.5px)}
</style>

<div class="screen" id="screen">
  <div class="island"></div>
  <div class="bar">
    <div class="btn kb" id="kb" title="Key">
      <svg width="20" height="26" viewBox="0 0 20 26" fill="none">
        <rect x="1.5" y="1.5" width="17" height="23" rx="2" fill="#efebdd" stroke="#38342b" stroke-width="1.6"/>
        <path d="M2 7.2h16M2 13h16M2 18.8h16" stroke="#38342b" stroke-width="1.2"/>
        <rect x="2" y="4" width="9" height="5" rx="1" fill="#38342b"/>
        <rect x="2" y="10.5" width="9" height="5" rx="1" fill="#38342b"/>
        <rect x="2" y="17" width="9" height="5" rx="1" fill="#38342b"/>
      </svg>
      <svg class="arrow" width="12" height="14" viewBox="0 0 12 14" fill="none">
        <path d="M2 1.5v11l8.5-5.5z" fill="#38342b"/>
      </svg>
    </div>
    <div class="btn round">↶</div>
    <div class="btn round">↷</div>
    <div class="banks"><span class="cur">A</span><span>B</span><span>C</span><span>D</span></div>
    <div class="sp"></div>
    <div class="btn prim">Tone</div>
    <div class="btn">Export</div>
  </div>

  <div class="lcd"><h3>LOAD KOALA<br>PROJECT</h3><small>TAP TO CHOOSE FILE</small></div>
  <div class="pads" id="pads"></div>

  <div class="drawer"><div class="inner"><div class="cap">KEY</div><div class="ks" id="ks"></div></div></div>
  <div class="home"></div>
</div>

<script>
const LOADED={1:"#b3a6f2",2:"#8fb4f5",3:"#b3a6f2",5:"#e9a3d3",6:"#8fb4f5",7:"#b3a6f2",8:"#8fb4f5",9:"#a2e6ef",10:"#8fb4f5",13:"#b3a6f2",14:"#e9a3d3",16:"#ecbd72"};
const mk=(n,glow)=>{const a=[];for(let k=1;k<=n;k++){a.push(`0 ${k*0.5}px 0 color-mix(in srgb,var(--wt) ${100-Math.round(k/n*100)}%,var(--wb))`)}a.push(glow,'inset 0 1px 0 #ffffff33');return a.join(',')};
const st=document.createElement('style');
st.textContent=`.pad{box-shadow:${mk(9,'0 7px 10px color-mix(in srgb,var(--wb) 45%,transparent)')}}.pad.on{box-shadow:${mk(9,'0 7px 12px color-mix(in srgb,var(--c) 55%,transparent)')}}.pad.down,.pad.on.down{box-shadow:${mk(4,'0 3px 6px color-mix(in srgb,var(--wb) 40%,transparent)')}}`;
document.head.appendChild(st);
let h='';for(let r=3;r>=0;r--)for(let c=1;c<=4;c++){const n=r*4+c,col=LOADED[n];h+=`<div class="pad${col?' on':''}"${col?` style="--c:${col}"`:''}><span>${n}</span></div>`}
document.getElementById('pads').innerHTML=h;
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
document.getElementById('ks').innerHTML=NOTES.map((n,i)=>`<i class="${n.includes('#')?'blk':''}${n==='A'?' sel':''}">${n}</i>`).join('');
const s=document.getElementById('screen');
document.getElementById('kb').addEventListener('click',()=>s.classList.toggle('open'));
if(location.hash==='#open')s.classList.add('open');
document.getElementById('pads').addEventListener('pointerdown',e=>{const p=e.target.closest('.pad');if(p)p.classList.add('down')});
addEventListener('pointerup',()=>document.querySelectorAll('.pad.down').forEach(p=>p.classList.remove('down')));
</script>
