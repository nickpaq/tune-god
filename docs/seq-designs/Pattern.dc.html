<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SEQ Pattern</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="seq.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Silkscreen&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="dev">
  <div class="island"></div>
  <div class="guide guide--top"><span>CURVE STARTS · 62</span></div>
  <div class="guide guide--bot"><span>CURVE STARTS · 812</span></div>
  <div class="area">
    <div class="upper">
      <div class="tray transport">
        <button class="cap" aria-label="Back to the other pages"><span class="led"></span><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8"/><path d="M11.5 6.5 8 10l3.5 3.5"/></svg>Back</button>
        <button class="bpm" aria-label="Tempo 85"><b>85</b><i>BPM</i></button>
        <button class="cap" aria-label="Play"><span class="led"></span><svg viewBox="0 0 20 20"><path class="f" d="M6 3.5v13l11-6.5z"/></svg>Play</button>
        <button class="cap" aria-label="Record"><span class="led"></span><svg viewBox="0 0 20 20"><circle class="f" cx="10" cy="10" r="6.5"/></svg>Rec</button>
        <button class="cap" aria-label="Mixer"><span class="led"></span><svg viewBox="0 0 20 20"><path d="M5 3v14M10 3v14M15 3v14"/><rect class="f" x="3" y="11" width="4" height="3" rx="1"/><rect class="f" x="8" y="5" width="4" height="3" rx="1"/><rect class="f" x="13" y="8" width="4" height="3" rx="1"/></svg>Mix</button>
      </div>
      <div class="strip">
        <button class="cap cap--on" aria-label="Loop"><span class="led"></span><svg viewBox="0 0 20 20"><path d="M5 9V8a3 3 0 0 1 3-3h7l-2.2-2.2M15 11v1a3 3 0 0 1-3 3H5l2.2 2.2"/></svg></button>
        <div class="scenes">
          <div class="scene scene--sel">
            <div class="lane" style="--lc:var(--bA)">1</div>
            <div class="lane" style="--lc:var(--bB)">1</div>
            <div class="lane" style="--lc:var(--bC)">1</div>
            <div class="lane lane--off"></div>
          </div>
          <div class="scene scene--dim">
            <div class="lane" style="--lc:var(--bA)">2</div>
            <div class="lane" style="--lc:var(--bB)">2</div>
            <div class="lane" style="--lc:var(--bC)">1</div>
            <div class="lane" style="--lc:var(--bD)">1</div>
          </div>
        </div>
      </div>

      <div class="screen" style="height:40px;flex:none;padding:5px 9px">
        <div class="oled"><div class="oled__head"><span>Pattern 1</span><button style="border:0;padding:0;background:none;color:#000;font:inherit;text-transform:inherit" aria-label="Delete pattern">Delete</button></div></div>
      </div>

      <div class="tray" style="gap:4px">
        <button class="cap cap--pat cap--on" aria-label="Pattern 1"><span class="led"></span><b>1</b><span class="mx"><i class="k on"></i><i></i><i></i><i class="on"></i><i></i><i class="s on"></i><i></i><i></i><i class="h on"></i><i></i><i class="k on"></i><i></i><i></i><i class="s on"></i><i></i><i class="h on"></i></span></button>
        <button class="cap cap--pat" aria-label="Pattern 2"><span class="led"></span><b>2</b><span class="mx"><i class="k on"></i><i></i><i></i><i></i><i></i><i class="s on"></i><i></i><i class="h on"></i><i class="k on"></i><i></i><i></i><i></i><i></i><i class="s on"></i><i></i><i></i></span></button>
        <button class="cap cap--pat" aria-label="Pattern 3"><span class="led"></span><b>3</b><span class="mx"><i></i><i class="h on"></i><i></i><i class="h on"></i><i class="k on"></i><i></i><i></i><i></i><i></i><i class="h on"></i><i class="s on"></i><i></i><i class="k on"></i><i></i><i></i><i class="h on"></i></span></button>
        <button class="cap cap--pat" aria-label="Pattern 4"><span class="led"></span><b>4</b><span class="mx"><i class="k on"></i><i class="k on"></i><i></i><i></i><i></i><i class="s on"></i><i></i><i></i><i class="h on"></i><i></i><i class="h on"></i><i></i><i class="k on"></i><i></i><i class="s on"></i><i></i></span></button>
      </div>

      <div class="group">
        <div class="row"><svg class="i" viewBox="0 0 20 20"><rect x="2" y="5" width="16" height="10" rx="2"/><path d="m7.5 8.5 5 3M12.5 8.5l-5 3"/></svg><span class="row__label">No pattern in scene</span><button class="cap cap--side" aria-label="No pattern in scene" role="switch" aria-checked="false"><span class="led"></span>Off</button></div>
        <div class="row"><svg class="i" viewBox="0 0 20 20"><path d="M2 10h16M5 6.5 2 10l3 3.5M15 6.5 18 10l-3 3.5"/></svg><span class="row__label">Pattern length</span><span class="row__value">4 bars</span><svg class="chev" viewBox="0 0 8 14"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg></div>
      </div>

      <div class="keys2">
        <button class="cap" aria-label="Clear pattern"><svg viewBox="0 0 20 20"><rect x="2" y="6" width="7" height="8" rx="1.5"/><rect x="11" y="6" width="7" height="8" rx="1.5"/></svg>Clear</button>
        <button class="cap" aria-label="Double pattern"><svg viewBox="0 0 20 20"><rect x="2" y="6" width="7" height="8" rx="1.5"/><rect x="11" y="6" width="7" height="8" rx="1.5"/><circle class="f" cx="5.5" cy="10" r="1.3"/><circle class="f" cx="14.5" cy="10" r="1.3"/></svg>Double</button>
      </div>
      <div class="keys2">
        <button class="cap" aria-label="Step mode"><svg viewBox="0 0 20 20"><rect x="2" y="6" width="16" height="8" rx="2"/><path d="M5.5 10h.01M8.5 10h.01M11.5 10h.01M14.5 10h.01" stroke-width="2.4"/></svg>Step mode</button>
      </div>
      <div class="keys2">
        <button class="cap" aria-label="Erase"><svg viewBox="0 0 20 20"><path d="m3.5 12.5 7-7.5a1.6 1.6 0 0 1 2.3 0l3.2 3.3a1.6 1.6 0 0 1 0 2.2L11 16.5H6.5zM8.5 7.8l5.2 5.4"/></svg>Erase</button>
        <button class="cap" aria-label="Mute"><svg viewBox="0 0 20 20"><path d="M3 8h3l4-3.5v11L6 12H3zM13.5 7.5l4 5M17.5 7.5l-4 5"/></svg>Mute</button>
      </div>
      <div class="keys2">
        <button class="cap cap--dim" aria-label="Undo"><svg viewBox="0 0 20 20"><path d="M3.5 8.5h8a4 4 0 0 1 0 8H8M3.5 8.5 7 5M3.5 8.5 7 12"/></svg>Undo</button>
        <button class="cap cap--dim" aria-label="Redo"><svg viewBox="0 0 20 20"><path d="M16.5 8.5h-8a4 4 0 0 0 0 8H12M16.5 8.5 13 5M16.5 8.5 13 12"/></svg>Redo</button>
      </div>
      <div class="group" style="margin-top:auto">
        <div class="row"><svg class="i" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M10 5.5V10l3 2"/></svg><span class="row__label">History</span><span class="row__value"></span><svg class="chev" viewBox="0 0 8 14"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg></div>
      </div>
    </div>
    <div class="lower">
      <div class="tray banks">
        <button class="cap cap--on" style="--lc:var(--bA)" aria-label="Bank A"><span class="lamp"></span>A<svg viewBox="0 0 22 22"><path d="M3 3h16v16H3zM3 8.3h16M3 13.7h16M8.3 3v16M13.7 3v16"/></svg></button>
        <button class="cap" style="--lc:var(--bB)" aria-label="Bank B"><span class="lamp"></span>B<svg viewBox="0 0 22 22"><path d="M3 3h16v16H3zM3 8.3h16M3 13.7h16M8.3 3v16M13.7 3v16"/></svg></button>
        <button class="cap" style="--lc:var(--bC)" aria-label="Bank C"><span class="lamp"></span>C<svg viewBox="0 0 22 22"><path d="M3 3h16v16H3zM3 8.3h16M3 13.7h16M8.3 3v16M13.7 3v16"/></svg></button>
        <button class="cap" style="--lc:var(--bD)" aria-label="Bank D keys"><span class="lamp"></span>D<svg viewBox="0 0 22 22"><path d="M3 3h16v16H3zM8.3 3v16M13.7 3v16"/><rect class="f" x="6.6" y="3" width="3.4" height="9"/><rect class="f" x="12" y="3" width="3.4" height="9"/></svg></button>
      </div>
      <div class="tray nav">
        <button class="cap" aria-label="Play pads"><span class="led"></span><svg viewBox="0 0 20 20"><circle class="f" cx="5" cy="14.5" r="2.2"/><circle class="f" cx="14" cy="12.5" r="2.2"/><path d="M7.2 14.5V5l9-2v9.5M7.2 7.5l9-2"/></svg>Play</button>
        <button class="cap" aria-label="Velocity"><span class="led"></span><svg viewBox="0 0 20 20"><path d="M4 17V9M8 17V4M12 17V11M16 17V7"/></svg>Vel</button>
        <button class="cap cap--on" aria-label="Pattern"><span class="led"></span><svg viewBox="0 0 20 20"><path class="f" d="M3.5 15.5 10 5l6.5 10.5z"/></svg>Pattern</button>
        <button class="cap" aria-label="Sample edit"><span class="led"></span><svg viewBox="0 0 20 20"><path d="M1.5 10h2.2l1.6-5 2.4 10 2.2-8 1.6 5 1.4-2h5.6"/></svg>Edit</button>
        <button class="cap" aria-label="Sounds"><span class="led"></span><svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m12.8 12.8 5 5"/></svg>Sounds</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
