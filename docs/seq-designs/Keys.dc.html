<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SEQ Keys</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="seq.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Silkscreen&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="dev">
  <div class="island"></div>
  <div class="guide guide--top"><span>CURVE STARTS · 62</span></div>
  <div class="guide guide--bot"><span>CURVE STARTS · 812</span></div>
  <div class="area">
    <div class="upper">
      <div class="tray transport">
        <button class="cap" aria-label="Back to the other pages"><span class="led"></span><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8"/><path d="M11.5 6.5 8 10l3.5 3.5"/></svg>Back</button>
        <button class="bpm" aria-label="Tempo 85"><b>85</b><i>BPM</i></button>
        <button class="cap" aria-label="Play"><span class="led"></span><svg viewBox="0 0 20 20"><path class="f" d="M6 3.5v13l11-6.5z"/></svg>Play</button>
        <button class="cap" aria-label="Record"><span class="led"></span><svg viewBox="0 0 20 20"><circle class="f" cx="10" cy="10" r="6.5"/></svg>Rec</button>
        <button class="cap" aria-label="Mixer"><span class="led"></span><svg viewBox="0 0 20 20"><path d="M5 3v14M10 3v14M15 3v14"/><rect class="f" x="3" y="11" width="4" height="3" rx="1"/><rect class="f" x="8" y="5" width="4" height="3" rx="1"/><rect class="f" x="13" y="8" width="4" height="3" rx="1"/></svg>Mix</button>
      </div>
      <div class="strip">
        <button class="cap cap--on" aria-label="Loop"><span class="led"></span><svg viewBox="0 0 20 20"><path d="M5 9V8a3 3 0 0 1 3-3h7l-2.2-2.2M15 11v1a3 3 0 0 1-3 3H5l2.2 2.2"/></svg></button>
        <div class="scenes">
          <div class="scene scene--sel">
            <div class="lane" style="--lc:var(--bA)">1</div>
            <div class="lane" style="--lc:var(--bB)">1</div>
            <div class="lane" style="--lc:var(--bC)">1</div>
            <div class="lane lane--off"></div>
          </div>
          <div class="scene scene--dim">
            <div class="lane" style="--lc:var(--bA)">2</div>
            <div class="lane" style="--lc:var(--bB)">2</div>
            <div class="lane" style="--lc:var(--bC)">1</div>
            <div class="lane" style="--lc:var(--bD)">1</div>
          </div>
        </div>
      </div>

      <div class="keys2">
        <button class="cap" aria-label="Scale">Scale</button>
        <button class="cap" aria-label="Chord">Chord</button>
        <div class="tray" style="flex:1.7;align-items:center;padding:4px 4px">
          <button class="cap" style="flex:none;width:36px;height:34px" aria-label="Octave down"><svg viewBox="0 0 8 14" style="width:8px;height:14px"><path d="M6.5 1.5 1.5 7l5 5.5"/></svg></button>
          <div class="readout" style="flex:1;width:auto;height:34px;font-size:18px">C2</div>
          <button class="cap" style="flex:none;width:36px;height:34px" aria-label="Octave up"><svg viewBox="0 0 8 14" style="width:8px;height:14px"><path d="M1.5 1.5 6.5 7l-5 5.5"/></svg></button>
        </div>
      </div>

      <div class="board">
        <div class="scale"><i class="root"></i><i></i><i class="in"></i><i></i><i class="in"></i><i class="in"></i><i></i><i class="in"></i><i></i><i class="in"></i><i></i><i class="in"></i></div>
        <div class="piano">
          <div class="naturals">
            <button class="nat nat--on" aria-label="C"><span class="dot dot--root"></span>C</button>
            <button class="nat" aria-label="D"><span class="dot dot--in"></span>D</button>
            <button class="nat" aria-label="E"><span class="dot dot--in"></span>E</button>
            <button class="nat" aria-label="F"><span class="dot dot--in"></span>F</button>
            <button class="nat" aria-label="G"><span class="dot dot--in"></span>G</button>
            <button class="nat" aria-label="A"><span class="dot dot--in"></span>A</button>
            <button class="nat" aria-label="B"><span class="dot dot--in"></span>B</button>
          </div>
          <button class="sharp" style="--i:0" aria-label="C sharp"><span class="dot"></span>C#</button>
          <button class="sharp" style="--i:1" aria-label="D sharp"><span class="dot"></span>D#</button>
          <button class="sharp" style="--i:3" aria-label="F sharp"><span class="dot"></span>F#</button>
          <button class="sharp" style="--i:4" aria-label="G sharp"><span class="dot"></span>G#</button>
          <button class="sharp" style="--i:5" aria-label="A sharp"><span class="dot"></span>A#</button>
        </div>
        <div class="scale"><i class="root"></i><i></i><i class="in"></i><i></i><i class="in"></i><i class="in"></i><i></i><i class="in"></i><i></i><i class="in"></i><i></i><i class="in"></i></div>
        <div class="piano">
          <div class="naturals">
            <button class="nat" aria-label="C"><span class="dot dot--root"></span>C</button>
            <button class="nat" aria-label="D"><span class="dot dot--in"></span>D</button>
            <button class="nat" aria-label="E"><span class="dot dot--in"></span>E</button>
            <button class="nat" aria-label="F"><span class="dot dot--in"></span>F</button>
            <button class="nat" aria-label="G"><span class="dot dot--in"></span>G</button>
            <button class="nat" aria-label="A"><span class="dot dot--in"></span>A</button>
            <button class="nat" aria-label="B"><span class="dot dot--in"></span>B</button>
          </div>
          <button class="sharp" style="--i:0" aria-label="C sharp"><span class="dot"></span>C#</button>
          <button class="sharp" style="--i:1" aria-label="D sharp"><span class="dot"></span>D#</button>
          <button class="sharp" style="--i:3" aria-label="F sharp"><span class="dot"></span>F#</button>
          <button class="sharp" style="--i:4" aria-label="G sharp"><span class="dot"></span>G#</button>
          <button class="sharp" style="--i:5" aria-label="A sharp"><span class="dot"></span>A#</button>
        </div>
      </div>
    </div>
    <div class="lower">
      <div class="tray banks">
        <button class="cap" style="--lc:var(--bA)" aria-label="Bank A"><span class="lamp"></span>A<svg viewBox="0 0 22 22"><path d="M3 3h16v16H3zM3 8.3h16M3 13.7h16M8.3 3v16M13.7 3v16"/></svg></button>
        <button class="cap" style="--lc:var(--bB)" aria-label="Bank B"><span class="lamp"></span>B<svg viewBox="0 0 22 22"><path d="M3 3h16v16H3zM3 8.3h16M3 13.7h16M8.3 3v16M13.7 3v16"/></svg></button>
        <button class="cap" style="--lc:var(--bC)" aria-label="Bank C"><span class="lamp"></span>C<svg viewBox="0 0 22 22"><path d="M3 3h16v16H3zM3 8.3h16M3 13.7h16M8.3 3v16M13.7 3v16"/></svg></button>
        <button class="cap cap--on" style="--lc:var(--bD)" aria-label="Bank D keys"><span class="lamp"></span>D<svg viewBox="0 0 22 22"><path d="M3 3h16v16H3zM8.3 3v16M13.7 3v16"/><rect class="f" x="6.6" y="3" width="3.4" height="9"/><rect class="f" x="12" y="3" width="3.4" height="9"/></svg></button>
      </div>
      <div class="tray nav">
        <button class="cap" aria-label="Play pads"><span class="led"></span><svg viewBox="0 0 20 20"><circle class="f" cx="5" cy="14.5" r="2.2"/><circle class="f" cx="14" cy="12.5" r="2.2"/><path d="M7.2 14.5V5l9-2v9.5M7.2 7.5l9-2"/></svg>Play</button>
        <button class="cap" aria-label="Velocity"><span class="led"></span><svg viewBox="0 0 20 20"><path d="M4 17V9M8 17V4M12 17V11M16 17V7"/></svg>Vel</button>
        <button class="cap" aria-label="Pattern"><span class="led"></span><svg viewBox="0 0 20 20"><path class="f" d="M3.5 15.5 10 5l6.5 10.5z"/></svg>Pattern</button>
        <button class="cap" aria-label="Sample edit"><span class="led"></span><svg viewBox="0 0 20 20"><path d="M1.5 10h2.2l1.6-5 2.4 10 2.2-8 1.6 5 1.4-2h5.6"/></svg>Edit</button>
        <button class="cap" aria-label="Sounds"><span class="led"></span><svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m12.8 12.8 5 5"/></svg>Sounds</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":402,"height":874}}'>

</script>
</body>
</html>
